<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Perfil</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="tarjeta-perfil" class="card">
        <!-- Imagen con un ID para poder cambiar el atributo src -->
        <img id="foto-usuario" src="img/perfil1.jpg" alt="Foto de usuario">
        
        <!-- Textos con ID para poder modificar el textContent -->
        <h2 id="nombre-usuario">Juan Pérez</h2>
        <p id="bio-usuario">Desarrollador Web Junior.</p>
        
        <!-- Un contenedor vacío para inyectar HTML dinámico -->
        <div id="estado-cuenta"></div>
    </div>

    <!-- El script va al final -->
    <script src="app.js" defer></script>
</body>
</html>
